<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roll the Dice, Meet Jean-Michel!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Lilita+One&display=swap">
<style>
/* Layout: a goose-game track that spirals around a central sign panel on wide screens and becomes a zigzag trail on phones */
:root{
  --bg:#E5EBDF; --board:#D6E2CF; --surface:#FAFBF6; --ink:#1D2924; --muted:#56675F; --line:#BACAB2;
  --road:#C9B788; --road-dash:#FFFCF2; --road-edge:#A8692B; --road-shade:transparent;
  --board-veil:rgba(250,252,244,.08);
  --hub:#173A30; --hub-ink:#F7F1DE; --hub-muted:#B5C9BC; --gold:#E7C45B;
  --accent:#C8432F; --accent-ink:#FFFFFF;
  --die:#FFFDF7; --die-edge:#D9D0BE; --pip:#22302A;
  --term-bg:#0A1610; --term-fg:#86F0A2; --term-dim:#4F8A63;
  --scrim:rgba(12,22,18,.58);
  --shadow:0 1px 0 rgba(29,41,36,.06), 0 8px 18px -10px rgba(29,41,36,.35);
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gap:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --board:#16211C; --surface:#1C2823; --ink:#E4ECE7; --muted:#9DB0A6; --line:#2C3B34;
    --road:#4A4029; --road-dash:#80704A; --road-edge:#4E3418; --road-shade:rgba(12,9,4,.42);
    --board-veil:rgba(8,18,13,.68);
    --hub:#1F3F35; --hub-ink:#F7F1DE; --hub-muted:#A9C0B3; --gold:#EBCB66;
    --accent:#EE6650; --accent-ink:#1A0C09;
    --die:#F4EFE3; --die-edge:#BFB59F; --pip:#1D2924;
    --scrim:rgba(0,0,0,.66);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -12px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --board:#16211C; --surface:#1C2823; --ink:#E4ECE7; --muted:#9DB0A6; --line:#2C3B34;
  --road:#4A4029; --road-dash:#80704A; --road-edge:#4E3418; --road-shade:rgba(12,9,4,.42);
  --board-veil:rgba(8,18,13,.68);
  --hub:#1F3F35; --hub-ink:#F7F1DE; --hub-muted:#A9C0B3; --gold:#EBCB66;
  --accent:#EE6650; --accent-ink:#1A0C09;
  --die:#F4EFE3; --die-edge:#BFB59F; --pip:#1D2924;
  --scrim:rgba(0,0,0,.66);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -12px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
main{max-width:1340px; margin:0 auto; padding-block:24px 32px; display:flex; flex-direction:column; gap:18px}
html[data-compact] main{padding-block:14px calc(110px + env(safe-area-inset-bottom, 0px))}

/* ---------- Board ---------- */
.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(var(--cols, 8), minmax(0, 1fr));
  grid-auto-rows:minmax(132px, auto);
  gap:var(--gap);
  padding:28px 22px 22px;
  background:
    linear-gradient(var(--board-veil), var(--board-veil)),
    var(--board-img, none) 0 0 / 400px 400px repeat,
    var(--board);
  border-radius:26px;
  box-shadow:inset 0 0 0 3px color-mix(in srgb, #3E6B2A 55%, var(--line)), inset 0 0 40px rgba(20,50,20,.22), var(--shadow);
}
html[data-compact] .board{grid-auto-rows:minmax(116px, auto); padding:24px 12px 14px; border-radius:20px; --gap:16px}
.road{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible}
.road path{fill:none; stroke-linejoin:round; stroke-linecap:round}
.road .edge{stroke:var(--road-edge); stroke-width:48}
.road .bed{stroke:var(--road); stroke-width:40}
.road .shade{stroke:var(--road-shade); stroke-width:40}
html[data-compact] .road .edge{stroke-width:38}
html[data-compact] .road .bed,html[data-compact] .road .shade{stroke-width:31}

/* ---------- Tiles ---------- */
.tile{
  --tc:#888; --tc-on:#fff;
  position:relative; z-index:1; min-width:0;
  display:flex; flex-direction:column;
  padding:0;
  text-align:left; font:inherit; color:var(--ink); cursor:pointer;
  background:var(--surface);
  border:3px solid var(--tc);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transform:translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
  transition:transform .22s cubic-bezier(.3,.7,.3,1.3), box-shadow .2s ease;
}
.tile:hover,.tile:focus-visible{transform:translate(var(--dx, 0px), calc(var(--dy, 0px) - 5px)) rotate(calc(var(--rot, 0deg) * .25)) scale(1.04); z-index:4}
.tile:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.tile:not(.is-wide){align-self:center}
.tile.is-here{box-shadow:0 0 0 4px var(--accent), 0 14px 28px -10px color-mix(in srgb, var(--accent) 70%, transparent)}

/* painted frame drawn over the square (9-slice image, one per category) */
.tile.has-frame{border:0; padding:12px; border-radius:9px}
.tile.has-frame::after,.m-pic.has-frame::after{
  content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
  border-style:solid; border-color:transparent; border-width:15px;
  border-image-source:var(--frame-img); border-image-slice:40; border-image-width:15px; border-image-repeat:stretch;
}
.tile.has-frame .pic{border-radius:3px 3px 0 0}
.tile.has-frame .txt{border-radius:0 0 3px 3px}
.tile.has-frame.is-wide .pic{border-radius:3px 0 0 3px}
.tile.has-frame.is-wide .txt{border-radius:0 3px 3px 0}

/* picture area */
.pic{position:relative; display:block; aspect-ratio:5 / 4; overflow:hidden; background:color-mix(in srgb, var(--tc) 22%, var(--surface))}
.pic img{position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s ease}
.pic.contain{background:var(--surface)}
.pic.contain img{object-fit:contain; padding:10px}
/* finish banner drawn over the last picture */
.finish-banner{position:absolute; z-index:2; left:13%; right:1%; top:3px; pointer-events:none; filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.finish-banner svg{display:block; width:100%; height:auto}
.finish-banner text{font-family:var(--f-display); font-size:30px; letter-spacing:1.5px}
.t-finish .pic.contain img{padding:30% 8% 5%}
.t-finish .ttl{-webkit-line-clamp:3}
.tile:hover .pic img{transform:scale(1.07)}
.pic-ico{position:absolute; inset:0; display:grid; place-items:center; color:color-mix(in srgb, var(--tc) 72%, var(--ink))}
.pic-ico svg{width:40%; height:40%}
.pic .tile-top{position:absolute; z-index:2; top:6px; left:6px; right:6px}
.when{position:absolute; z-index:2; left:6px; bottom:6px; max-width:calc(100% - 12px);
  font:500 10.5px/1 var(--f-mono); letter-spacing:.02em; font-variant-numeric:tabular-nums;
  padding:4px 7px; border-radius:6px; background:rgba(16,24,20,.78); color:#F7F4EA;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* text area */
.txt{flex:1; display:flex; flex-direction:column; gap:3px; padding:8px 10px 10px;
  background:color-mix(in srgb, var(--tc) 13%, var(--surface)); border-top:2px solid color-mix(in srgb, var(--tc) 55%, var(--surface))}
.tile.is-visited .txt{background:color-mix(in srgb, var(--tc) 26%, var(--surface))}
.no-pic .txt{border-top:0; padding:10px 11px 12px; gap:5px}

.tile-top{display:flex; align-items:center; gap:6px; min-height:28px}
.num{
  flex:none; min-width:28px; height:28px; padding:0 6px; border-radius:999px;
  display:grid; place-items:center;
  background:var(--tc); color:var(--tc-on);
  box-shadow:0 0 0 2px var(--surface), 0 2px 6px rgba(0,0,0,.25);
  font-family:var(--f-display); font-size:15px; letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.chip{font:600 10px/1 var(--f-mono); letter-spacing:.12em; padding:5px 7px; border-radius:5px; background:var(--ink); color:var(--surface); box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico{flex:none; margin-left:auto; width:26px; height:26px; color:color-mix(in srgb, var(--tc) 72%, var(--ink))}
.ico svg{width:100%; height:100%; display:block}
.date{font:500 11px/1.3 var(--f-mono); color:var(--muted); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.ttl{font-weight:700; font-size:13.5px; line-height:1.18; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; text-wrap:balance}
.sub{font-size:12px; line-height:1.25; color:var(--muted); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.t-start .ttl,.t-finish .ttl{font-family:var(--f-display); font-weight:400; font-size:clamp(17px, 1.6vw, 22px); letter-spacing:.01em}

/* the finish square spans several columns on wide boards: picture beside the text */
.tile.is-wide{flex-direction:row}
.tile.is-wide .pic{flex:none; width:40%; aspect-ratio:auto; align-self:stretch}
.tile.is-wide .txt{justify-content:center; padding:16px 20px; border-top:0; border-left:2px solid color-mix(in srgb, var(--tc) 55%, var(--surface))}
.tile.is-wide .ttl{font-size:clamp(20px, 2vw, 28px); -webkit-line-clamp:3}
.tile.is-wide .sub{font-size:14px; -webkit-line-clamp:2}

/* ---------- Pawn ---------- */
.pawn{position:absolute; left:0; top:0; z-index:5; width:34px; height:46px; pointer-events:none;
  transition:transform .34s cubic-bezier(.3,.7,.3,1)}
.pawn svg{width:100%; height:100%; display:block; overflow:visible}
.pawn.hop .pawn-body{animation:hop .34s ease-out}
.pawn.is-pic{width:56px; height:82px}
html[data-compact] .pawn.is-pic{width:44px; height:65px}
.pawn-pic{display:block; width:100%; height:100%; transform-origin:50% 100%}
.pawn-pic img{display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 4px rgba(0,0,0,.38))}
@keyframes hop{0%{transform:translateY(0)} 45%{transform:translateY(-18px)} 100%{transform:translateY(0)}}

/* ---------- Hub (centre panel) ---------- */
.hub{
  position:relative; z-index:2; min-width:0;
  display:flex; flex-direction:column; justify-content:center; gap:18px;
  padding:22px 26px;
  background-color:var(--hub); color:var(--hub-ink);
  background-image:
    linear-gradient(90deg, color-mix(in srgb, var(--hub) 90%, transparent) 0%, color-mix(in srgb, var(--hub) 62%, transparent) 38%, transparent 66%),
    linear-gradient(0deg, color-mix(in srgb, var(--hub) 82%, transparent) 0%, transparent 48%),
    var(--hub-img, none);
  background-size:cover;
  background-position:center;
  border-radius:22px;
  overflow:hidden;
  box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--gold) 40%, transparent), var(--shadow);
}
html[data-compact] .hub{padding:18px; gap:14px; background-position:72% center;
  background-image:
    linear-gradient(180deg, color-mix(in srgb, var(--hub) 82%, transparent) 0%, color-mix(in srgb, var(--hub) 45%, transparent) 55%, color-mix(in srgb, var(--hub) 85%, transparent) 100%),
    var(--hub-img, none)}
.hub > header{max-width:min(560px, 58%)}
html[data-compact] .hub > header{max-width:none}
.eyebrow{margin:0 0 6px; font:500 11.5px/1.3 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--hub-muted)}
.hub h1{text-shadow:0 2px 14px rgba(0,0,0,.35); margin:0; font-family:var(--f-display); font-weight:400; font-size:clamp(28px, 3.3vw, 48px); line-height:1.02; letter-spacing:.005em; text-wrap:balance}
.hub h1 span{color:var(--gold)}
.subtitle{margin:8px 0 0; color:var(--hub-ink); opacity:.88; font-size:15.5px; text-shadow:0 1px 8px rgba(0,0,0,.4)}
.hub-body{display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); gap:20px; align-items:center}
html[data-compact] .hub-body{grid-template-columns:minmax(0, 1fr)}

.controls{display:flex; align-items:center; gap:16px; min-width:0}
html[data-compact] .controls{
  position:fixed; left:0; right:0; bottom:0; z-index:20; gap:12px;
  background:var(--hub);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow:0 -10px 26px -14px rgba(0,0,0,.6), inset 0 3px 0 color-mix(in srgb, var(--gold) 40%, transparent);
}
.ctrl-main{min-width:0; flex:1}
.btn-row{display:flex; flex-wrap:wrap; gap:8px}
.btn{
  display:inline-flex; align-items:center; gap:7px;
  font:700 14px/1 var(--f-body); padding:11px 16px; border-radius:999px;
  border:2px solid transparent; cursor:pointer; white-space:nowrap;
  transition:transform .08s ease, opacity .2s;
}
.btn svg{width:16px; height:16px}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 55%, #000)}
.btn-primary:active{transform:translateY(2px); box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 55%, #000)}
.btn-soft{background:color-mix(in srgb, var(--hub-ink) 10%, transparent); color:var(--hub-ink); border-color:color-mix(in srgb, var(--hub-ink) 28%, transparent)}
.btn-ghost{background:transparent; color:var(--hub-muted); padding-inline:10px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
html[data-compact] .btn{padding:10px 13px; font-size:13.5px}
html[data-compact] .btn-ghost .lbl{display:none}
.status{margin:10px 0 0; font-size:13.5px; color:var(--hub-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status b{color:var(--hub-ink)}
html[data-compact] .status{margin-top:7px; font-size:12.5px}

.terminal{
  list-style:none; margin:0; padding:12px 14px; min-width:0; min-height:104px;
  background:color-mix(in srgb, var(--term-bg) 84%, transparent); color:var(--term-dim);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  border-radius:10px; border:1px solid color-mix(in srgb, var(--term-fg) 22%, transparent);
  font:12px/1.6 var(--f-mono);
  display:flex; flex-direction:column; justify-content:flex-end;
}
.terminal li{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.terminal li:last-child{color:var(--term-fg)}
.terminal li:last-child::after{content:"\2588"; margin-left:3px; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- Die ---------- */
.die-btn{--d:62px; flex:none; background:none; border:0; padding:8px; cursor:pointer; border-radius:16px}
.die-btn:focus-visible{outline:3px solid var(--gold)}
.die-btn:disabled{cursor:progress}
html[data-compact] .die-btn{--d:42px; padding:4px}
.die-scene{display:block; width:var(--d); height:var(--d); perspective:520px}
.die-tilt{display:block; width:100%; height:100%; transform-style:preserve-3d; transform:rotateX(-20deg) rotateY(-26deg)}
.cube{display:block; position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 1s cubic-bezier(.16,.68,.22,1)}
.face{
  position:absolute; inset:0; background:var(--die); border-radius:20%;
  box-shadow:inset 0 0 0 1.5px var(--die-edge), inset 0 -5px 9px rgba(0,0,0,.08);
  display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 1fr); padding:15%;
  backface-visibility:hidden;
}
.pip{width:74%; height:74%; border-radius:50%; background:var(--pip); place-self:center}
.f1 .pip{width:95%; height:95%; background:var(--accent)}
.f1{transform:rotateY(0deg) translateZ(calc(var(--d) / 2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--d) / 2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--d) / 2))}
.f5{transform:rotateY(-90deg) translateZ(calc(var(--d) / 2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--d) / 2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--d) / 2))}

/* ---------- Legend ---------- */
.legend{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; justify-content:space-between}
.legend ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px}
.legend li{display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 8px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line); font-size:13px; font-weight:700}
.legend .dot{width:14px; height:14px; border-radius:50%; background:var(--c)}
.hint{margin:0; color:var(--muted); font-size:13px}
kbd{font:500 11.5px/1 var(--f-mono); padding:3px 6px; border-radius:5px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line), 0 1px 0 var(--line)}

/* ---------- Story card (modal) ---------- */
.overlay{position:fixed; inset:0; z-index:40; background:var(--scrim); display:grid; place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation:fade .18s ease-out}
.sheet{--tc:#888; --tc-on:#fff; width:min(580px, 100%); max-height:min(88vh, 720px); display:flex; flex-direction:column;
  background:var(--surface); color:var(--ink); border-radius:22px; overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55), inset 0 0 0 2px color-mix(in srgb, var(--tc) 50%, var(--surface));
  animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.96)}}
.band{display:flex; align-items:center; gap:10px; padding:12px 12px 12px 20px; background:var(--tc); color:var(--tc-on)}
.band .m-num{font-family:var(--f-display); font-size:18px; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.band .m-type{font:600 11px/1 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; opacity:.85}
.icon-btn{margin-left:auto; width:38px; height:38px; display:grid; place-items:center; border-radius:50%; border:0; cursor:pointer;
  background:color-mix(in srgb, var(--tc-on) 16%, transparent); color:inherit}
.icon-btn svg{width:18px; height:18px}
.icon-btn:focus-visible{outline:3px solid var(--tc-on); outline-offset:2px}
.sheet-body{padding:22px 24px 8px; overflow:auto; min-height:0}
.m-head{display:flex; align-items:center; gap:14px; margin-bottom:12px}
.m-ico{flex:none; width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--tc) 18%, var(--surface)); color:color-mix(in srgb, var(--tc) 72%, var(--ink));
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--tc) 45%, var(--surface))}
.m-ico svg{width:32px; height:32px}
.m-head.has-pic{align-items:flex-end; gap:18px; margin-bottom:16px}
.m-pic{flex:none; width:clamp(120px, 36%, 210px); margin:0; border-radius:14px; overflow:hidden;
  border:3px solid var(--tc); box-shadow:var(--shadow); transform:rotate(-1.5deg)}
.m-pic img{display:block; width:100%; height:auto}
.m-pic.has-frame{position:relative; border:0; padding:11px; border-radius:9px; background:var(--surface)}
.m-pic.has-frame::after{border-width:14px; border-image-width:14px}
.m-pic.has-frame img{border-radius:3px}
.m-date{margin:0; font:500 12.5px/1.4 var(--f-mono); color:var(--muted)}
.m-title{margin:2px 0 0; font-family:var(--f-display); font-weight:400; font-size:clamp(24px, 4vw, 31px); line-height:1.08; text-wrap:balance}
.m-sub{margin:0 0 10px; font-weight:700; color:color-mix(in srgb, var(--tc) 60%, var(--ink))}
.m-text{margin:0; font-size:16px; line-height:1.62; max-width:62ch}
.m-text a{color:var(--accent); text-underline-offset:3px; word-break:break-all}
.sheet-foot{display:flex; align-items:center; gap:8px; padding:14px 18px 18px; flex-wrap:wrap}
.sheet-foot .spacer{flex:1}
.nav-btn{width:40px; height:40px; display:grid; place-items:center; border-radius:50%; cursor:pointer; background:transparent; color:var(--ink); border:2px solid var(--line)}
.nav-btn svg{width:18px; height:18px}

    chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M12 7.6l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z"/>',
    network:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="18.5" r="2"/><circle cx="19" cy="18.5" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M12 7v3.5M10.4 13.8l-3.8 3.2M13.6 13.8l3.8 3.2"/>',
    sprout:'<path d="M12 21v-9"/><path d="M12 12C12 8 9 6 4.5 6c0 4 3 6 7.5 6z"/><path d="M12 10c0-3.5 2.5-6 7.5-6 0 4-3 6-7.5 6z"/><path d="M6 21h12"/>',
    pipeline:'<path d="M12 12c-2-2.8-3.6-4.5-6-4.5a4.5 4.5 0 0 0 0 9c2.4 0 4-1.7 6-4.5s3.6-4.5 6-4.5a4.5 4.5 0 0 1 0 9c-2.4 0-4-1.7-6-4.5z"/>',
    lotus:'<path d="M12 5c2 2.5 2.5 5.5 0 10-2.5-4.5-2-7.5 0-10z"/><path d="M12 15c-3-.5-6-2.5-7-6 3 0 5.5 1.5 7 6zM12 15c3-.5 6-2.5 7-6-3 0-5.5 1.5-7 6z"/><path d="M4 18.5c2.5 1.5 13.5 1.5 16 0"/>',
    workflow:'<rect x="3" y="3.5" width="6" height="5" rx="1"/><rect x="15" y="9.5" width="6" height="5" rx="1"/><rect x="3" y="15.5" width="6" height="5" rx="1"/><path d="M9 6h3v12H9M12 12h3"/>',
    robot:'<rect x="5" y="8" width="14" height="11" rx="2.5"/><path d="M12 4.5V8"/><circle cx="12" cy="3.5" r="1"/><circle cx="9.5" cy="13" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/><path d="M10 16.5h4M3 12v3M21 12v3"/>',
    flag:'<path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/>'
  };
  const ICON_BY_ID = {1:'star',2:'book',3:'atom',4:'tennis',5:'cap',6:'floppy',7:'terminal',8:'euro',9:'hammer',10:'checklist',
    11:'monitor',12:'gauge',13:'house',14:'map',15:'database',16:'bike',17:'card',18:'braces',19:'chat',20:'network',
    21:'sprout',22:'pipeline',23:'lotus',24:'workflow',25:'robot',26:'flag'};
  const ICON_BY_TYPE = {start:'star', finish:'flag', education:'cap', professional:'terminal', hobby:'sprout', personal_project:'braces'};
  const svgIcon = key => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[key] || ICONS.star}</svg>`;
  const iconFor = t => svgIcon(ICON_BY_ID[t.id] || ICON_BY_TYPE[t.type]);

  /* ---- Colour helpers: pick readable text on each type colour ---- */
  function lum(hex){
    const h = hex.replace('#','');
    const c = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255).map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4));
    return .2126*c[0] + .7152*c[1] + .0722*c[2];
  }
  const onColor = hex => { const L = lum(hex); return (1.05/(L+.05)) >= ((L+.05)/(lum('#1D2924')+.05)) ? '#FFFFFF' : '#1D2924'; };
  const styleOf = t => DATA.style[t.type] || {color:'#888888', label:t.type};

  /* ---- Text helpers ---- */
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  function shortDate(d){
    if (ISO.test(d)) return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const ys = d.match(/\b(19|20)\d{2}\b/g);
    if (ys){ const u = [...new Set(ys)]; return u.length > 1 ? `${u[0]}–${u[u.length-1]}` : u[0]; }
    return d;
  }
  const longDate = d => ISO.test(d) ? new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : d;
  function parts(t){
    if (t.type === 'start' || t.type === 'finish') return {main:t.title, sub:(t.description||'').split(' — ')[0]};
    const i = t.title.indexOf(' — ');
    return i > 0 ? {main:t.title.slice(0,i), sub:t.title.slice(i+3)} : {main:t.title, sub:''};
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const pad2 = n => String(n).padStart(2,'0');

  /* ---- Header ---- */
  const [t1, ...rest] = DATA.board.title.split(', ');
  $('title').innerHTML = rest.length ? `${esc(t1)}, <span>${esc(rest.join(', '))}</span>` : esc(DATA.board.title);
  $('subtitle').textContent = DATA.board.subtitle || '';
  if (DATA.board.path_image){ $('cobbleImg').setAttribute('href', DATA.board.path_image); $('roadBed').style.stroke = 'url(#cobble)'; }
  if (DATA.board.board_image) $('board').style.setProperty('--board-img', `url("${DATA.board.board_image}")`);
  if (DATA.board.pawn_image){
    const pImg = $('pawnImg');
    pImg.addEventListener('load', () => {
      $('pawnPic').hidden = false; $('pawnSvg').style.display = 'none';
      $('pawn').classList.add('is-pic');
      requestAnimationFrame(() => placePawn(pos, false));
    });
    pImg.src = DATA.board.pawn_image;
  }
  if (DATA.board.hub_image) $('hub').style.setProperty('--hub-img', `url("${DATA.board.hub_image}")`);
  const y0 = (order[0].date.match(/\d{4}/)||[''])[0], y1 = (order[N-1].date.match(/\d{4}/)||[''])[0];
  $('eyebrow').textContent = `${y0} → ${y1} · ${N} squares`;

  /* ---- Legend ---- */
  const legend = $('legend');
  const seenTypes = new Set();
  Object.entries(DATA.style).forEach(([k, s]) => {
    if (k === 'finish') return;
    const label = k === 'start' ? 'Start / Finish' : s.label;
    if (seenTypes.has(label)) return; seenTypes.add(label);
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="--c:${s.color}"></span>${esc(label)}`;
    legend.appendChild(li);
  });

  /* ---- Finish banner: red ribbon between two chequered flags ---- */
  const FINISH_BANNER = `<span class="finish-banner"><svg viewBox="0 0 260 84" aria-hidden="true">
    <defs><pattern id="chk" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1D2924"/><rect width="4" height="4" fill="#FFFFFF"/><rect x="4" y="4" width="4" height="4" fill="#FFFFFF"/></pattern></defs>
    <g id="flagL"><path d="M10 4v76" stroke="#6B4A2B" stroke-width="4" stroke-linecap="round"/>
      <path d="M12 6q18-7 36 1-6 12 0 24-18-8-36-1z" fill="url(#chk)" stroke="#1D2924" stroke-width="2" stroke-linejoin="round"/></g>
    <use href="#flagL" transform="translate(260 0) scale(-1 1)"/>
    <path d="M44 40h26v32H44l8-16z" fill="#9E2A1E" stroke="#6E1A12" stroke-width="2" stroke-linejoin="round"/>
    <path d="M216 40h-26v32h26l-8-16z" fill="#9E2A1E" stroke="#6E1A12" stroke-width="2" stroke-linejoin="round"/>
    <rect x="58" y="24" width="144" height="46" rx="7" fill="#D6402F" stroke="#7A1F15" stroke-width="2"/>
    <path d="M66 30h128" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="57" text-anchor="middle" fill="#FFFFFF">FINISH</text>
  </svg></span>`;

  /* ---- Build tiles ---- */
  const board = $('board'), hub = $('hub'), pawn = $('pawn');
  const tileEls = order.map((t, i) => {
    const s = styleOf(t), p = parts(t);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `tile t-${t.type}`;
    b.style.setProperty('--tc', s.color);
    b.style.setProperty('--tc-on', onColor(s.color));
    if (s.frame){ b.classList.add('has-frame'); b.style.setProperty('--frame-img', `url("${s.frame}")`); }
    b.title = t.description || '';
    b.setAttribute('aria-label', `Square ${i+1}: ${t.title}, ${t.date}`);
    const chip = t.type === 'start' ? '<span class="chip">START</span>' : (t.type === 'finish' && !t.image) ? '<span class="chip">FINISH</span>' : '';
    const banner = t.type === 'finish' ? FINISH_BANNER : '';
    const showDate = !(t.type === 'start' || t.type === 'finish');
    const text = `<span class="ttl">${esc(p.main)}</span>` + (p.sub ? `<span class="sub">${esc(p.sub)}</span>` : '');
    if (t.image){
      b.classList.add('has-pic');
      b.innerHTML =
        `<span class="pic${t.image_fit === 'contain' ? ' contain' : ''}"><span class="pic-ico">${iconFor(t)}</span><img src="${esc(t.image)}" alt="" decoding="async">` +
        banner + `<span class="tile-top"><span class="num">${i+1}</span>${chip}</span>` +
        (showDate ? `<span class="when">${esc(shortDate(t.date))}</span>` : '') + `</span>` +
        `<span class="txt">${text}</span>`;
      const img = b.querySelector('img');
      img.addEventListener('error', () => { img.hidden = true; });
      img.addEventListener('load', () => requestAnimationFrame(redraw));
    } else {
      b.classList.add('no-pic');
      b.innerHTML =
        `<span class="txt"><span class="tile-top"><span class="num">${i+1}</span>${chip}<span class="ico">${iconFor(t)}</span></span>` +
        (showDate ? `<span class="date">${esc(shortDate(t.date))}</span>` : '') + text + `</span>`;
    }
    b.addEventListener('click', () => openCard(i));
    board.insertBefore(b, pawn);
    return b;
  });

  /* ---- Playful placement: each square gets a fixed tilt and nudge (same on every load) ---- */
  const rnd = (n, k) => { const x = Math.sin(n * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const JIT = order.map((t, i) => ({
    rot: (i % 2 ? 1 : -1) * (0.8 + rnd(i + 1, 1) * 1.9),
    dx: (rnd(i + 1, 2) - .5) * 8,
    dy: (rnd(i + 1, 3) - .5) * 16
  }));

  /* ---- Layouts: spiral around the hub (wide) or zigzag trail (narrow) ---- */
  function spiral(n, C){
    for (let R = 5; R <= 9; R++){
      const P = 2*C + 2*R - 4;
      if (n > P && n <= P + (C-2)){
        const cells = [];
        for (let c = 0; c < C; c++) cells.push([0,c]);
        for (let r = 1; r < R; r++) cells.push([r,C-1]);
        for (let c = C-2; c >= 0; c--) cells.push([R-1,c]);
        for (let r = R-2; r >= 1; r--) cells.push([r,0]);
        const k = n - P;
        for (let c = 1; c <= k; c++) cells.push([1,c]);
        const out = cells.map(([r,c]) => ({r, c, span:1}));
        out[n-1].span = (C-2) - k + 1;
        return {cols:C, cells:out, hub:{r0:2, r1:R-2, c0:1, c1:C-2}};
      }
    }
    return null;
  }
  function snake(n, K){
    const cells = [];
    for (let i = 0; i < n; i++){
      const row = Math.floor(i/K);
      cells.push({r:row+1, c: row % 2 === 0 ? i % K : K-1-(i % K), span:1});
    }
    return {cols:K, cells, hub:{r0:0, r1:0, c0:0, c1:K-1}};
  }

  let lastW = -1;
  function applyLayout(){
    const w = board.clientWidth;
    lastW = w;
    const compact = w < 860;
    document.documentElement.toggleAttribute('data-compact', compact);
    const L = (!compact && spiral(N, 8)) || snake(N, compact ? (w >= 520 ? 3 : 2) : 6);
    board.style.setProperty('--cols', L.cols);
    L.cells.forEach((cell, i) => {
      tileEls[i].style.gridRow = `${cell.r+1}`;
      tileEls[i].style.gridColumn = `${cell.c+1} / span ${cell.span}`;
      tileEls[i].classList.toggle('is-wide', cell.span > 1);
      const f = compact ? .6 : 1, j = JIT[i];
      tileEls[i]._dx = j.dx * f; tileEls[i]._dy = j.dy * f;
      tileEls[i].style.setProperty('--rot', `${(j.rot * f / cell.span).toFixed(2)}deg`);
      tileEls[i].style.setProperty('--dx', `${tileEls[i]._dx.toFixed(1)}px`);
      tileEls[i].style.setProperty('--dy', `${tileEls[i]._dy.toFixed(1)}px`);
    });
    hub.style.gridRow = `${L.hub.r0+1} / ${L.hub.r1+2}`;
    hub.style.gridColumn = `${L.hub.c0+1} / ${L.hub.c1+2}`;
    requestAnimationFrame(redraw);
  }
  function center(el){ return [el.offsetLeft + el.offsetWidth/2 + (el._dx || 0), el.offsetTop + el.offsetHeight/2 + (el._dy || 0)]; }
  function drawRoad(){
    const road = $('road');
    road.setAttribute('viewBox', `0 0 ${board.clientWidth} ${board.clientHeight}`);
    const d = tileEls.map((el, i) => (i ? 'L' : 'M') + center(el).map(v => v.toFixed(1)).join(' ')).join(' ');
    $('roadBed').setAttribute('d', d);
    $('roadEdge').setAttribute('d', d);
    $('roadShade').setAttribute('d', d);
  }
  function redraw(){ drawRoad(); placePawn(pos, false); }

  new ResizeObserver(() => {
    if (Math.abs(board.clientWidth - lastW) > 1) applyLayout();
    else requestAnimationFrame(redraw);
  }).observe(board);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(redraw));

  /* ---- Pawn ---- */
  let pos = 0;
  const visited = new Set([0]);
  function placePawn(i, animate){
    const el = tileEls[i];
    const pw = pawn.offsetWidth, ph = pawn.offsetHeight;
    const x = el.offsetLeft + el.offsetWidth - pw - 8 + (el._dx || 0), y = el.offsetTop - Math.round(ph * .6) + (el._dy || 0);
    if (!animate) pawn.style.transition = 'none';
    pawn.style.transform = `translate(${x}px, ${y}px)`;
    if (!animate){ void pawn.offsetWidth; pawn.style.transition = ''; }
  }
  function hop(){ if (REDUCE) return; pawn.classList.remove('hop'); void pawn.offsetWidth; pawn.classList.add('hop'); }
  function ensureVisible(i){
    if (!document.documentElement.hasAttribute('data-compact')) return;
    const r = tileEls[i].getBoundingClientRect();
    if (r.top < 60 || r.bottom > innerHeight - 120) tileEls[i].scrollIntoView({block:'center', behavior: REDUCE ? 'auto' : 'smooth'});
  }

  /* ---- Die ---- */
  const cube = $('cube');
  const PIPS = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  for (let f = 1; f <= 6; f++){
    const face = document.createElement('span');
    face.className = `face f${f}`;
    PIPS[f].forEach(p => {
      const pip = document.createElement('span');
      pip.className = 'pip';
      pip.style.gridRow = String(Math.ceil(p/3));
      pip.style.gridColumn = String((p-1) % 3 + 1);
      face.appendChild(pip);
    });
    cube.appendChild(face);
  }
  const SHOW = {1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
  let spinA = 0, spinB = 0;
  function spinDie(n){
    spinA += 2 + Math.floor(Math.random()*2);
    spinB += 1 + Math.floor(Math.random()*2);
    const [rx, ry] = SHOW[n];
    cube.style.transform = `rotateX(${rx + 360*spinA}deg) rotateY(${ry + 360*spinB}deg)`;
    return sleep(REDUCE ? 80 : 1000);
  }
  function rollValue(){
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % 6); }
    catch { return 1 + Math.floor(Math.random()*6); }
  }

  /* ---- Job log (a small JES-style terminal) ---- */
  const term = $('term');
  function log(line){
    const li = document.createElement('li');
    li.textContent = line;
    term.appendChild(li);
    while (term.children.length > 5) term.removeChild(term.firstChild);
  }
  function bootLog(){
    term.innerHTML = '';
    log(`//JMICHEL JOB (${y0}),'ROLL THE DICE',CLASS=A`);
    log(`$HASP373 JMICHEL STARTED - ${shortDate(order[0].date).toUpperCase()}`);
  }

  /* ---- Status & controls ---- */
  const rollBtn = $('rollBtn'), stepBtn = $('stepBtn'), resetBtn = $('resetBtn'), dieBtn = $('dieBtn');
  let busy = false;
  function updateUI(){
    tileEls.forEach((el, i) => {
      el.classList.toggle('is-here', i === pos);
      el.classList.toggle('is-visited', visited.has(i) && i !== pos);
    });
    const done = pos >= N-1;
    $('status').innerHTML = `Square <b>${pos+1}</b> of ${N} · ${esc(parts(order[pos]).main)}`;
    rollBtn.textContent = done ? 'Play again' : 'Roll the dice';
    $('mRoll').textContent = done ? 'Play again' : 'Roll the dice';
    rollBtn.disabled = busy;
    dieBtn.disabled = busy;
    stepBtn.disabled = busy || done;
    resetBtn.disabled = busy || pos === 0;
  }
  function setBusy(b){ busy = b; updateUI(); }

  async function moveBy(steps){
    for (let s = 0; s < steps; s++){
      pos++; visited.add(pos);
      placePawn(pos, !REDUCE); hop(); updateUI(); ensureVisible(pos);
      await sleep(REDUCE ? 140 : 360);
    }
  }
  function landed(){
    const t = order[pos];
    log(`STEP${pad2(pos+1)} RC=0000 ${parts(t).main.toUpperCase()}`);
    if (pos >= N-1){
      log('$HASP395 JMICHEL ENDED - RC=0000');
      log(`NEXT JOB: ${(DATA.board.finish && DATA.board.finish.label || parts(t).sub).toUpperCase()}`);
      confetti();
    }
    openCard(pos);
  }
  async function roll(){
    if (busy) return;
    if (pos >= N-1){ restart(); return; }
    closeCard(false);
    setBusy(true);
    const r = rollValue();
    await spinDie(r);
    const steps = Math.min(r, N-1-pos);
    log(steps < r ? `ROLL ${r} -> ADVANCE ${steps} (FINISH LINE)` : `ROLL ${r} -> ADVANCE ${steps}`);
    await moveBy(steps);
    await sleep(220);
    busy = false; updateUI();
    landed();
  }
  async function step(){
    if (busy || pos >= N-1) return;
    closeCard(false);
    setBusy(true);
    await moveBy(1);
    await sleep(160);
    busy = false; updateUI();
    landed();
  }
  function restart(){
    if (busy) return;
    closeCard(false);
    pos = 0; visited.clear(); visited.add(0);
    placePawn(0, !REDUCE); hop();
    bootLog(); updateUI(); ensureVisible(0);
  }
  rollBtn.addEventListener('click', roll);
  dieBtn.addEventListener('click', roll);
  stepBtn.addEventListener('click', step);
  resetBtn.addEventListener('click', restart);

  /* ---- Story card ---- */
  const overlay = $('overlay'), sheet = $('sheet');
  let viewing = 0, lastFocus = null;
  function fillCard(i){
    viewing = i;
    const t = order[i], s = styleOf(t), p = parts(t);
    sheet.style.setProperty('--tc', s.color);
    sheet.style.setProperty('--tc-on', onColor(s.color));
    $('mPic').classList.toggle('has-frame', !!s.frame);
    if (s.frame) sheet.style.setProperty('--frame-img', `url("${s.frame}")`);
    $('mNum').textContent = `Square ${pad2(i+1)} / ${N}`;
    $('mType').textContent = s.label;
    $('mIco').innerHTML = iconFor(t);
    const mImg = $('mImg');
    mImg.onerror = () => { $('mPic').hidden = true; $('mIco').hidden = false; $('mHead').classList.remove('has-pic'); };
    if (t.image){ mImg.src = t.image; $('mPic').hidden = false; $('mIco').hidden = true; $('mHead').classList.add('has-pic'); }
    else { mImg.removeAttribute('src'); $('mPic').hidden = true; $('mIco').hidden = false; $('mHead').classList.remove('has-pic'); }
    $('mDate').textContent = longDate(t.date);
    $('mTitle').textContent = p.main;
    $('mSub').textContent = p.sub;
    $('mSub').hidden = !p.sub;
    $('mText').innerHTML = linkify(t.full_description || t.description || '');
    $('mPrev').disabled = i === 0;
    $('mNext').disabled = i === N-1;
    sheet.querySelector('.sheet-body').scrollTop = 0;
  }
  function openCard(i){
    if (overlay.hidden) lastFocus = document.activeElement;
    fillCard(i);
    overlay.hidden = false;
    $('mRoll').focus({preventScroll:true});
  }
  function closeCard(restoreFocus = true){
    if (overlay.hidden) return;
    overlay.hidden = true;
    if (restoreFocus && lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }
  $('mClose').addEventListener('click', () => closeCard());
  $('mDone').addEventListener('click', () => closeCard());
  $('mRoll').addEventListener('click', () => { closeCard(false); roll(); });
  $('mPrev').addEventListener('click', () => viewing > 0 && fillCard(viewing-1));
  $('mNext').addEventListener('click', () => viewing < N-1 && fillCard(viewing+1));
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });

  document.addEventListener('keydown', e => {
    if (!overlay.hidden){
      if (e.key === 'Escape'){ e.preventDefault(); closeCard(); }
      else if (e.key === 'ArrowRight' && viewing < N-1) fillCard(viewing+1);
      else if (e.key === 'ArrowLeft' && viewing > 0) fillCard(viewing-1);
      else if (e.key === 'Tab'){
        const f = [...sheet.querySelectorAll('button:not([disabled]), a[href]')];
        if (!f.length) return;
        const firstEl = f[0], lastEl = f[f.length-1];
        if (e.shiftKey && document.activeElement === firstEl){ e.preventDefault(); lastEl.focus(); }
        else if (!e.shiftKey && document.activeElement === lastEl){ e.preventDefault(); firstEl.focus(); }
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onControl = /^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if ((e.key === ' ' && !onControl) || e.key === 'r' || e.key === 'R'){ e.preventDefault(); roll(); }
    else if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N'){ e.preventDefault(); step(); }
  });

  /* ---- Finish-line confetti ---- */
  function confetti(){
    if (REDUCE) return;
    const cv = $('confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
    cv.hidden = false;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = Object.values(DATA.style).map(s => s.color);
    const P = Array.from({length:170}, () => ({
      x: innerWidth/2 + (Math.random()-.5)*240, y: innerHeight*.38,
      vx: (Math.random()-.5)*14, vy: -Math.random()*13 - 4,
      w: Math.random()*7 + 5, rot: Math.random()*6, vr: (Math.random()-.5)*.35,
      c: colors[Math.floor(Math.random()*colors.length)]
    }));
    const t0 = performance.now();
    (function frame(now){
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.w/4, p.w, p.w/2);
        ctx.restore();
      });
      if (now - t0 < 3400) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })(t0);
  }

  /* ---- Start ---- */
  bootLog();
  applyLayout();
  updateUI();
})();
</script>
